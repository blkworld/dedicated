<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    ================================================================
    STEP 1 — EDIT THESE THREE TAGS FIRST (title + description)
    This is what shows up as the blue link + gray text on Google.
    Replace "John Doe" with your real name everywhere in this file.
    ================================================================
  -->
  <title>John Doe — Official Site</title>
  <meta name="description" content="John Doe — official website, portfolio, and links. Find John Doe's profiles, work, and contact information here.">
  <meta name="author" content="John Doe">

  <!-- Canonical URL: after you deploy, put your real Vercel/domain URL here -->
  <link rel="canonical" href="https://your-domain.vercel.app/">

  <!--
    ================================================================
    STEP 2 — SOCIAL PREVIEW TAGS (Open Graph / Twitter)
    These control how your link looks when pasted into WhatsApp,
    Twitter/X, Discord, etc. Not required for Google, but free
    and easy, so we include them.
    ================================================================
  -->
  <meta property="og:type" content="profile">
  <meta property="og:title" content="John Doe — Official Site">
  <meta property="og:description" content="John Doe — official website, portfolio, and links.">
  <meta property="og:image" content="https://your-domain.vercel.app/images/profile-1.jpg">
  <meta property="og:url" content="https://your-domain.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="John Doe — Official Site">
  <meta name="twitter:description" content="John Doe — official website, portfolio, and links.">
  <meta name="twitter:image" content="https://your-domain.vercel.app/images/profile-1.jpg">

  <!-- Favicon (optional, put a favicon.ico in the root folder if you have one) -->
  <link rel="icon" href="/favicon.ico" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!--
    ================================================================
    STEP 3 — STRUCTURED DATA (Person schema)
    This is a hidden block of code that tells Google "this whole
    page is about a real person named John Doe". It is one of the
    biggest levers for showing up correctly when someone searches
    your name. Edit every value inside, don't leave it as-is.
    ================================================================
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "John Doe",
    "url": "https://your-domain.vercel.app/",
    "image": "https://your-domain.vercel.app/images/profile-1.jpg",
    "jobTitle": "Your Job Title Here",
    "description": "Short one-sentence bio about who you are and what you do.",
    "sameAs": [
      "https://www.instagram.com/yourhandle",
      "https://www.linkedin.com/in/yourhandle",
      "https://twitter.com/yourhandle",
      "https://github.com/yourhandle"
    ]
  }
  </script>
</head>
<body>

  <main class="page">
    <div class="hero">
      <h1 class="name">John Doe</h1>
      <!-- STEP 1b — one short line about what you do. Real text here helps SEO too. -->
      <p class="tagline">Your role or one-line tagline goes here</p>
    </div>

    <section class="gallery" aria-label="About John Doe">
      <figure class="card">
        <!--
          STEP 4 — REPLACE IMAGES
          Put your real photos inside the /images folder, then change
          the src below. The alt text is what Google Images reads to
          understand what's in the photo and match it to your name —
          always include your real name inside the alt text.
        -->
        <div class="frame">
          <img
            src="images/profile-1.jpg"
            alt="John Doe portrait photo"
            width="600"
            height="600"
            loading="eager">
        </div>
        <figcaption class="caption">
          Hello, I am <strong>John Doe</strong>, short one-line bio goes here.
        </figcaption>
      </figure>

      <figure class="card card--secondary">
        <div class="frame">
          <img
            src="images/profile-2.jpg"
            alt="John Doe, second photo"
            width="600"
            height="600"
            loading="lazy">
        </div>
      </figure>
    </section>

    <!--
      STEP 5 — YOUR LINK
      Point this at whatever you want people to click through to:
      Linktree, portfolio, Instagram, LinkedIn, contact form, etc.
    -->
    <a class="cta" href="https://your-link-here.com" target="_blank" rel="noopener">
      Check my link <span aria-hidden="true">↗</span>
    </a>
  </main>


</body>
</html>
