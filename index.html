  <!--
    NOTE on jobTitle below: schema.org expects an occupation here
    (e.g. "Data Analyst"), not a name + academic credentials. Right
    now it holds "Devita Octa Viani, S.AP., S.M." — replace it with
    your actual role/title, or delete the "jobTitle" line entirely.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Devita Octa",
    "url": "https://devitaocta.com/",
    "image": "https://devitaocta.com/images/devita-octa-portrait.jpg",
    "jobTitle": "Devita Octa Viani, S.AP., S.M.",
    "description": "Devita Octa — work in data, design, and visual editing. Skills in SQL, Linux, Python, PowerQuery, PowerPivot, Canva, Photoshop, and video editing.",
    "sameAs": [
      "https://www.instagram.com/devita.octa",
      "https://id.linkedin.com/in/devita-octa-viani",
      "https://twitter.com/dibawahumurrr"
    ]
  }
  </script>
</head>
<body>

  <header class="hero">
    <h1 class="name">Devita Octa</h1>
    <p class="subtitle">A look at recent work.</p>
    <a class="cta" href="https://www.instagram.com/devita.octa" target="_blank" rel="noopener">Instagram</a>
  </header>

  <!--
    Work grid — a plain responsive gallery. Every tile is the same
    shape (portrait, cropped to fit) so new pieces slot in cleanly
    no matter their original size. To add a piece: copy one whole
    <a class="tile">...</a> block and change the src/alt/href.

    Each tile links to its own full-size image in a new tab — change
    the href if a piece should link somewhere else instead (e.g. a
    live project URL).
  -->
  <main class="work" aria-label="Selected work">
    <a class="tile" href="images/devita-octa-portrait.jpg" target="_blank" rel="noopener">
      <img src="images/devita-octa-portrait.jpg" alt="Devita Octa, portrait photo" loading="eager">
    </a>
    <a class="tile" href="images/devita-octa-photo.jpg" target="_blank" rel="noopener">
      <img src="images/devita-octa-photo.jpg" alt="Devita Octa, LinkedIn profile photo" loading="lazy">
    </a>
    <a class="tile" href="images/devita-octa-selfie.jpg" target="_blank" rel="noopener">
      <img src="images/devita-octa-selfie.jpg" alt="Devita Octa, selfie" loading="lazy">
    </a>
  </main>

  <footer class="site-footer">
    <nav class="socials" aria-label="Social profiles">
      <a href="https://www.instagram.com/devita.octa" target="_blank" rel="noopener">Instagram</a>
      <a href="https://id.linkedin.com/in/devita-octa-viani" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://twitter.com/dibawahumurrr" target="_blank" rel="noopener">Twitter</a>
    </nav>
  </footer>

</body>
