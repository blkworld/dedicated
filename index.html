<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============================================================
  EDIT THESE 5 THINGS BEFORE DEPLOYING (search for "EDIT:"):
  1. Your name          — appears ~6 times below
  2. Your role/title
  3. Your work link (portfolio / GitHub / Behance / etc.)
  4. Your photo          — replace assets/photo-placeholder.svg
  5. Your domain         — replace https://yourdomain.com everywhere
============================================================ -->

<title>Your Name — Your Role</title> <!-- EDIT: title -->
<meta name="description" content="Your Name is a Your Role. This is the official website — see recent work and get in touch."> <!-- EDIT: description -->
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://yourdomain.com/"> <!-- EDIT: domain -->

<!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
<meta property="og:type" content="profile">
<meta property="og:title" content="Your Name — Your Role"> <!-- EDIT -->
<meta property="og:description" content="Your Name is a Your Role. See recent work and get in touch."> <!-- EDIT -->
<meta property="og:image" content="https://yourdomain.com/assets/photo-placeholder.svg"> <!-- EDIT: use a real .jpg/.png, not svg, for best compatibility -->
<meta property="og:url" content="https://yourdomain.com/"> <!-- EDIT -->

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your Name — Your Role"> <!-- EDIT -->
<meta name="twitter:description" content="Your Name is a Your Role."> <!-- EDIT -->
<meta name="twitter:image" content="https://yourdomain.com/assets/photo-placeholder.svg"> <!-- EDIT -->

<!-- Structured data: tells Google this page IS a specific person, which is what
     drives your photo showing up when someone searches your name. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Your Name",
  "jobTitle": "Photographer",
  "url": "https://yourdomain.com/",
  "image": "https://yourdomain.com/assets/photo-placeholder.svg",
  "sameAs": [
    "https://your-portfolio.example.com",
    "https://instagram.com/yourhandle"
  ]
}
</script>
<!-- EDIT: fill in the block above with real values. "sameAs" should list every
     other profile that's really you (GitHub, LinkedIn, Instagram, etc.) — this
     is one of the strongest signals for linking search results to your identity. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>

<main class="stage">
  <img
    class="stage-photo"
    src="assets/photo-placeholder.svg"
    alt="Your Name — photography portfolio" <!-- EDIT: alt text must contain your real name — this is what Google Images matches against -->
    width="1600" height="2000"
  >

  <div class="content">
    <p class="eyebrow">Photography</p>
    <h1>Your Name<span class="accent-dot">.</span></h1> <!-- EDIT -->
    <p class="role">Your Role / Title — one short line about what you shoot.</p> <!-- EDIT -->

    <ul class="links">
      <!-- EDIT: add/remove <li> entries freely. Keep 2–4 for a clean single row. -->
      <li><a href="https://your-portfolio.example.com" target="_blank" rel="me noopener">
        Portfolio
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a></li>
      <li><a href="https://instagram.com/yourhandle" target="_blank" rel="me noopener">
        Instagram
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a></li>
      <li><a href="mailto:you@example.com">
        Email
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a></li>
    </ul>
  </div>
</main>

</body>
</html>
